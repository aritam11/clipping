[project]
name = "clipper"
version = "0.1.0"
description = "Automated long-video to vertical short-form clips pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "faster-whisper>=1.1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "streamlink>=8.6.3",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
clip = "clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]
